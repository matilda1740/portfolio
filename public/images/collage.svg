<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Cobalt and Teal editorial collage</title>
<desc id="desc">Layered abstract geometric artwork with a cool circle, cobalt square, teal semicircle, dotted matrix and fine orbital lines.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25314A"/><stop offset="1" stop-color="#17263C"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8E5F0"/><stop offset="1" stop-color="#A8C6D4"/></linearGradient>
 <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51D5C0"/><stop offset="1" stop-color="#2FA997"/></linearGradient>
 <linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#88A5FF"/><stop offset="1" stop-color="#4C6FDB"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.1" fill="#51D5C0" opacity=".9"/></pattern>
 <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#B7C7FF" stroke-width=".6" opacity=".23"/></pattern>
 <clipPath id="circleClip"><circle cx="275" cy="278" r="126"/></clipPath>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
 <path d="M692 66V670M96 573H365" fill="none" stroke="#9ADFD2" stroke-width="1.2" opacity=".65"/>
 <circle cx="96" cy="573" r="5.5" fill="#51D5C0"/><circle cx="692" cy="198" r="3.5" fill="#51D5C0"/><circle cx="692" cy="624" r="3.5" fill="#51D5C0"/>
 <rect x="390" y="88" width="170" height="536" fill="url(#panel)" opacity=".88"/>
 <rect x="390" y="88" width="170" height="536" fill="url(#grid)" opacity=".6"/>
 <path d="M405 155C450 125 488 186 545 130M398 213C452 176 498 238 553 190M398 454C444 418 502 485 553 438M398 520C450 480 500 553 553 505" fill="none" stroke="#9ADFD2" stroke-width="1.2" opacity=".28"/>
 <circle cx="275" cy="278" r="126" fill="url(#mint)"/>
 <g clip-path="url(#circleClip)"><rect x="149" y="152" width="252" height="252" fill="url(#grid)" opacity=".55"/><path d="M145 340C205 275 274 365 407 246" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity=".35"/></g>
 <circle cx="275" cy="278" r="94" fill="none" stroke="#51D5C0" stroke-width="1.2" opacity=".7"/>
 <rect x="438" y="230" width="210" height="210" fill="url(#cobalt)"/><rect x="438" y="230" width="210" height="210" fill="url(#grid)" opacity=".2"/>
 <rect x="120" y="405" width="242" height="132" fill="url(#dots)"/>
 <path d="M190 510C248 477 276 383 350 316S500 182 618 220S672 300 648 344" fill="none" stroke="#9ADFD2" stroke-width="1.2" opacity=".9"/>
 <path d="M485 440C496 382 545 352 600 362S711 424 678 514" fill="none" stroke="#51D5C0" stroke-width="1.2" opacity=".8"/>
 <circle cx="618" cy="220" r="13" fill="#88A5FF"/><circle cx="648" cy="344" r="6.5" fill="#51D5C0"/>
 <path d="M440 660A105 105 0 0 1 650 660Z" fill="url(#jade)"/><path d="M440 660A105 105 0 0 1 650 660" fill="none" stroke="#B7EDE3" stroke-width="1.3" opacity=".8"/>
 <circle cx="355" cy="104" r="48" fill="none" stroke="#B7C7FF" stroke-width="1.4"/><circle cx="355" cy="104" r="3" fill="#51D5C0"/>
</g></svg>